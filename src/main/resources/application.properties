spring.application.name=dota-stats-api
server.port=8080

opendota.base-url=https://api.opendota.com/api
# Opcional: sube el limite de tasa y elimina el tope mensual de OpenDota.
# Se obtiene en https://www.opendota.com/api-keys y se pasa por variable de entorno,
# nunca hardcodeada aqui.
opendota.api-key=${OPENDOTA_API_KEY:}

# --- Datos de meta (ver MetaProperties) ---
# Carga perezosa: al arrancar solo se piden /heroStats y el parche (o se lee la cache de disco);
# los matchups de cada enemigo se piden a OpenDota la primera vez que aparece en un draft.
# Brackets de OpenDota a sumar: 1=Herald 2=Guardian 3=Crusader 4=Archon 5=Legend 6=Ancient 7=Divine 8=Immortal
dotastats.meta.brackets=6,7
# Pausa de cortesia (ms) entre dos peticiones de matchups consecutivas de un mismo draft (max. 5).
# 0 = sin pausa: los enemigos que faltan se piden EN PARALELO (pool de max. 5 hilos).
# > 0 = modo serie con esa pausa entre peticiones (no se paraleliza para respetar la pausa)
dotastats.meta.throttle-ms=0
# Carga los datos base (cache de disco o /heroStats + parche) en segundo plano al arrancar
dotastats.meta.cargar-al-iniciar=true
# Minutos que se reutiliza la consulta del parche vivo; si cambia, el siguiente suggest descarta la cache y recarga
dotastats.meta.ttl-parche-minutos=30
# Archivo JSON donde se persiste heroStats + parche + matchups pedidos (escritura atomica). Vacio = sin cache de disco
dotastats.meta.cache-file=./data/meta-cache.json

# --- Motor de sugerencias (ver SugerenciasProperties) ---
dotastats.sugerencias.peso-meta=0.4
dotastats.sugerencias.peso-contra=0.6
# Partidas minimas de un duelo para que el motivo lo cite como tendencia (ver ventaja-minima-duelo); por debajo
# de este umbral el duelo se sigue usando en el puntaje (contraido hacia el meta) pero no se nombra en el motivo
dotastats.sugerencias.partidas-minimas-duelo=50
# Partidas virtuales al winrate del meta por posicion que se suman a cada duelo (contraccion hacia el meta):
# sin datos o con poca muestra el duelo vale casi lo mismo que el meta, no una ventaja
dotastats.sugerencias.fuerza-prior=100
dotastats.sugerencias.z=1.96
# Partidas virtuales al winrate de meta global (Wilson) que se suman a las partidas del heroe en la linea de mi
# posicion, para el meta por posicion: metaPosicion = (victoriasLinea + K*metaGlobal) / (partidasLinea + K).
# Sin datos de linea (o en las posiciones 4-5, sin linea mapeada) vale exactamente el meta global
dotastats.sugerencias.fuerza-prior-linea=200
# Diferencia minima de winrate (0..1) entre la estimacion contraida de un duelo y el meta por posicion para que
# el motivo lo cite como tendencia (positiva o negativa, p. ej. "tendencia: +4% contra Lion (51 partidas)")
dotastats.sugerencias.ventaja-minima-duelo=0.03
# Peso de cada enemigo en el counter (promedio ponderado) segun el slot (1-5) donde se puso.
# Oponentes directos de mi posicion: 1 y 5 -> enemigos 3 y 4; 2 -> enemigo 2; 3 y 4 -> enemigos 1 y 5.
# Los demas enemigos usan peso-otros-enemigos. Ambos >= 0 y no pueden ser cero a la vez
dotastats.sugerencias.peso-oponente-directo=1.0
dotastats.sugerencias.peso-otros-enemigos=0.5
# --- Personalizacion (solo si la peticion trae "steamId"; sin el, nada de esto se usa) ---
# Peso (0..1) del historial propio del jugador con cada heroe. Meta y counter se reescalan
# proporcionalmente por (1 - peso-personal), asi que los pesos siguen sumando 1:
#   puntaje = (1 - w) * (peso-meta*meta + peso-contra*counter)/(peso-meta+peso-contra) + w * personal
dotastats.sugerencias.peso-personal=0.25
# Partidas virtuales al winrate de meta del candidato que se suman al historial del jugador:
#   personal = (victorias + K*meta) / (partidas + K). Heroe nunca jugado => exactamente el meta (neutro)
dotastats.sugerencias.fuerza-prior-personal=20
# Partidas minimas del jugador con el heroe para citar "tu winrate: X% en N partidas" en el motivo
dotastats.sugerencias.min-partidas-personal=5
# (El historial por cuenta se cachea 30 min en memoria, ver CacheConfig; nunca en disco.)
# Posiciones 1-3: candidatos segun /scenarios/laneRoles (lane_role 1 segura, 2 central, 3 ofensiva).
# Un heroe entra si (partidas en la linea de la posicion / partidas en las lineas 1-3) >= umbral-linea
# y tiene al menos min-partidas-linea partidas en ella. La posicion 1 exige ademas alguna etiqueta de
# roles.1 (Carry): los soportes tambien juegan la linea segura. Los datos de linea se cargan junto a /heroStats
# (3 peticiones), se guardan en la cache de disco y se descartan con el parche.
dotastats.sugerencias.umbral-linea=0.30
dotastats.sugerencias.min-partidas-linea=30
# Listas de heroes por posicion (curadas A MANO, editables). Si una posicion tiene lista, sus candidatos son SOLO
# esos heroes (sin exigir etiqueta de rol ni datos de linea); sin lista (o vacia) se usa la regla de roles de abajo.
# Se usan para la 4 y la 5 porque las etiquetas de OpenDota son demasiado laxas (Enigma, Night Stalker o Earth Spirit
# llevan Support/Initiator) y los datos de linea tampoco separan a los soportes. Nombres localizados tal como salen
# en /api/draft/heroes, sin distinguir mayusculas ni acentos. Un nombre que no exista en el catalogo se avisa con un
# WARN en el log (no falla). REVISA estas listas despues de cada parche (rebalanceos, heroes nuevos o renombrados).
dotastats.sugerencias.heroes-posicion.4=Tusk,Earth Spirit,Mirana,Rubick,Clockwerk,Nyx Assassin,Bounty Hunter,Skywrath Mage,Windranger,Lion,Shadow Demon,Disruptor,Hoodwink,Snapfire,Dark Willow,Grimstroke,Spirit Breaker,Venomancer,Vengeful Spirit,Keeper of the Light,Ogre Magi,Pugna,Marci,Dazzle,Chen,Phoenix,Techies,Witch Doctor,Silencer,Treant Protector
dotastats.sugerencias.heroes-posicion.5=Crystal Maiden,Lich,Lion,Shadow Shaman,Warlock,Witch Doctor,Dazzle,Oracle,Io,Winter Wyvern,Ogre Magi,Jakiro,Treant Protector,Undying,Shadow Demon,Disruptor,Vengeful Spirit,Chen,Enchantress,Omniknight,Silencer,Abaddon,Bane,Dark Willow,Grimstroke,Snapfire,Keeper of the Light,Skywrath Mage,Venomancer,Pugna,Ancient Apparition,Phoenix,Hoodwink,Rubick
# Roles de OpenDota aceptados por posicion (heuristica; ver SugerenciasProperties.ROLES_POR_DEFECTO). Son el RESPALDO
# de las posiciones sin lista de arriba (p. ej. si se borra heroes-posicion.4) y, en las 1-3, solo el plan B
# cuando no hay datos de linea (la respuesta lo avisa en "advertencias")
dotastats.sugerencias.roles.1=Carry
dotastats.sugerencias.roles.2=Nuker,Carry
dotastats.sugerencias.roles.3=Initiator,Durable
dotastats.sugerencias.roles.4=Support,Initiator
dotastats.sugerencias.roles.5=Support
# Anulacion manual (opcional, tambien sobre las listas): heroes que nunca se sugieren en una posicion, por nombre y separados por coma
# dotastats.sugerencias.excluir-posicion.2=Bounty Hunter,Juggernaut


# --- Fila "Sugerencias por jugabilidad" (ver HabilidadProperties / RepositorioReglas / AnalizadorHabilidad) ---
# Puntos que aporta una regla que coincide contra un rival DIRECTO de mi linea, segun su confianza.
# Una confianza "media" o "baja" nunca se presenta como un counter seguro (se antepone "Posible:" al motivo).
dotastats.habilidad.peso-confianza-alta=1.0
dotastats.habilidad.peso-confianza-media=0.5
dotastats.habilidad.peso-confianza-baja=0.25
# Ubicacion del archivo de reglas (prefijo classpath: o file:). Las reglas se validan al arrancar (campos
# obligatorios y confianza alta/media/baja; falla rapido con un mensaje claro) y se resuelven contra el
# nombre de heroe canonico (el mismo snapshot de /heroStats que usa el motor de meta) la primera vez que se
# usan; un nombre que no exista en el catalogo tambien es un error. Para sumar una regla: agregarla a este
# archivo con id, enemigos, counter, habilidad/habilidadNombre, confianza y motivo (anula/rasgo opcionales).
# GET /api/reglas lista las reglas cargadas; GET /api/reglas/validacion las revisa contra
# /constants/abilities (detecta si una habilidad cambio o desaparecio tras un parche).
dotastats.habilidad.reglas-archivo=classpath:reglas-habilidades.json
# Rotacion de soportes: en partidas reales los soportes (posiciones 4 y 5) rotan a mid, asi que el enemigo del slot
# listado tambien cuenta para la fila de jugabilidad (reglas, dependencias curadas e interacciones automaticas),
# con peso-rotacion multiplicado en los puntos (los rivales directos pesan 1.0) y un motivo que dice "Al rotar a mid: ".
# slots-rotacion.N = slots enemigos (1-5) a los que rota la posicion N; una posicion sin linea usa su valor por
# defecto (4 y 5 -> 2; 1 a 3 -> ninguno) y una lista vacia (slots-rotacion.4=) la apaga. peso-rotacion >= 0; 0 apaga
# toda la rotacion. Un valor fuera de rango impide el arranque con un mensaje claro. NO afecta a la fila de meta.
dotastats.habilidad.slots-rotacion.4=2
dotastats.habilidad.slots-rotacion.5=2
dotastats.habilidad.peso-rotacion=0.5
# --- Interacciones automaticas (ver CatalogoHabilidades / DetectorHabilidades / TablaInteraccionesAutomaticas) ---
# Derivadas por palabra clave de /constants/abilities + /constants/hero_abilities para los enemigos y candidatos
# que NO tiene cubiertos ninguna regla escrita a mano. SIEMPRE confianza "media" (motivo con "Posible: ") y con
# un peso base = peso-confianza-media * factor-peso, multiplicado ademas por el peso propio de cada combinacion
# rasgo/capacidad (ESCAPE<-HEX pesa mas que ESCAPE<-SILENCIO/STUN/ROOT, ver TablaInteraccionesAutomaticas en el
# codigo). factor-peso=0.5 -> por defecto una interaccion automatica pesa la mitad de una regla a mano "media"
# (0.5*0.5=0.25), para que una regla escrita y verificada a mano siga pesando mas que una heuristica.
dotastats.habilidad.automatico.factor-peso=0.5
# --- Dependencias curadas (ver RepositorioDependencias / TablaContrarrestos / FiabilidadHerramienta) ---
# "Contrarrestar la dependencia, no al heroe": para los enemigos que figuran en este archivo (hoy Storm Spirit,
# Riki, Phantom Lancer, Huskar y Viper) la fila NO usa las interacciones automaticas por palabra clave de arriba,
# sino una tabla precalculada UNA vez por snapshot de meta. El archivo trae (1) las dependencias de cada enemigo
# (mecanismo, habilidad en la que se apoya y descripcion) y (2) las herramientas de los candidatos: habilidad,
# efecto curado a mano (HEX, SILENCIO, STUN, ROOT, DESARME, REVELADO, AREA, QUEMA_MANA, BREAK) y las claves del
# atributo de OpenDota de donde salen los numeros de nivel 1 (claveDuracion, claveEvidencia, claveRetraso).
# La estructura se valida al arrancar y los nombres de heroe contra el snapshot de meta la primera vez que se
# usan (un nombre desconocido es un error); las claves de habilidad y de atributo se validan contra el snapshot
# de habilidades (nunca contra la red): lo que no se respalde se descarta y se avisa por log. El peso de cada
# herramienta = peso-confianza-* x peso efecto/mecanismo (TablaPesosEfectoMecanismo) x fiabilidad (formula en
# FiabilidadHerramienta). La herramienta RANGO_MAYOR (alcance de ataque base mayor que el del enemigo, de
# /constants/heroes) no se cura: se deriva de las estadisticas.
dotastats.habilidad.dependencias.archivo=classpath:dependencias-heroes.json
# Ventaja minima de alcance de ataque base (a favor del candidato) para que RANGO_MAYOR cuente contra un enemigo
# con la dependencia ACOSO_RANGO: la diferencia debe ser MAYOR O IGUAL a este valor (por defecto 50; con 25 un
# Silencer de 600 ya calificaria contra un Viper de 575).
dotastats.habilidad.dependencias.rango-minimo=50
# Un nombre de heroe del archivo que no exista en el snapshot NO rompe la peticion: se salta esa entrada, se avisa
# por log y queda en TablaContrarrestos.problemas().

# --- Archivos del juego (segunda fuente de la fila de jugabilidad; ver ArchivosJuegoClientImpl / AGENTS.md 5.3) ---
# Espejo de los archivos de Valve en GitHub (NO es OpenDota): un archivo por heroe, npc_dota_hero_<x>.txt. Se piden
# (max. 5 en paralelo) en un hilo propio cuando se construye o se lee el snapshot de meta (arranque, refresco o
# parche nuevo): ninguna peticion de /api/draft/suggest dispara esa descarga. Mientras no llegan (o si GitHub esta
# caido) la fila usa las interacciones por palabra clave y avisa en "advertencias"; al llegar la tabla se reconstruye
# sola. Se guardan en la cache de disco junto al resto y se descartan con el parche. Un resultado parcial se usa y los
# heroes que faltan se piden en el siguiente calentamiento (reinicio o refresco); uno vacio nunca se guarda.
dotastats.juego.url-base=https://raw.githubusercontent.com/dotabuff/d2vpkr/master/dota/scripts/npc/heroes
# Plazo GLOBAL de toda la descarga; al vencer se conserva lo que ya llego y se cancela el resto
dotastats.juego.tiempo-maximo=60s
# Pasivas rompibles derivadas como dependencia PASIVAS de los enemigos sin curar. Apagado por defecto: casi todos los
# heroes tienen una, y las mismas 4 herramientas de break/desarme saldrian repetidas contra todos
dotastats.habilidad.juego.derivar-pasivas=false

# --- Interfaz web ---
# Origenes (separados por coma) con permiso CORS sobre /api/**. En desarrollo Vite usa su proxy, esto es para otros hosts.
dotastats.web.cors-origins=http://localhost:5173
